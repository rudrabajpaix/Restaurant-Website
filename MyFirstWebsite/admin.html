<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin | Canadian Pizza Burger</title>
<link rel="stylesheet" href="style.css">
<style>
    body { background: #f3f7fc; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px 60px; }
    .panel { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 5px 22px rgba(16,43,78,.07); margin-bottom: 18px; }
    .panel h2 { color: var(--dark); font-size: 18px; margin-bottom: 14px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .tabs { display: flex; gap: 8px; }
    .tab { border: 1px solid #dce4ee; background: #fff; border-radius: 30px; padding: 10px 18px; font-size: 13px; font-weight: 600; color: var(--dark); }
    .tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .banner { background: #fff7e0; border: 1px solid #f2d98a; color: #6b5200; padding: 12px 16px; border-radius: 10px; font-size: 12px; margin-bottom: 16px; line-height: 1.6; }
    .field { display: block; font-size: 12px; font-weight: 600; margin: 12px 0 6px; }
    .panel input, .panel select, .panel textarea { width: 100%; padding: 11px; border: 1px solid #dce4ee; border-radius: 7px; font-size: 13px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { border: 0; background: var(--blue); color: #fff; padding: 11px 18px; border-radius: 8px; font-weight: 700; font-size: 13px; }
    .btn.red { background: #fff0f0; color: var(--red); }
    .btn.grey { background: #edf2f7; color: var(--dark); }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .order { border: 1px solid #edf0f4; border-radius: 12px; padding: 14px; margin-bottom: 12px; font-size: 13px; line-height: 1.7; }
    .order-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .order a { color: var(--blue); font-weight: 600; text-decoration: none; }
    .order select { width: auto; }
    .item-row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #edf0f4; font-size: 13px; }
    .item-row img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; }
    .item-row .grow { flex: 1; }
    .item-row .btn { padding: 8px 12px; font-size: 12px; }
    .muted { color: var(--muted); font-size: 12px; }
    .preview { width: 110px; height: 110px; object-fit: cover; border-radius: 10px; margin-top: 8px; }
    @media (max-width: 600px) { .row2 { grid-template-columns: 1fr; } .item-row { flex-wrap: wrap; } }
</style>
</head>
<body>
<div class="wrap">

    <!-- LOGIN -->
    <div id="login" class="panel" style="max-width:400px;margin:60px auto" hidden>
        <h2>Owner Login 🍕</h2>
        <label class="field" for="email">Email</label>
        <input id="email" type="email" autocomplete="username">
        <label class="field" for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
        <p id="login-error" class="muted" style="color:var(--red);margin-top:10px"></p>
        <div class="btns"><button class="btn" id="login-btn">Login</button></div>
    </div>

    <!-- APP -->
    <div id="app" hidden>
        <div class="topbar">
            <h1 style="font-size:20px;color:var(--dark)">🍕 Admin Panel</h1>
            <div class="tabs">
                <button class="tab active" data-tab="orders">Orders</button>
                <button class="tab" data-tab="menu">Menu</button>
                <button class="tab" id="logout">Logout</button>
            </div>
        </div>

        <div class="banner" id="demo-banner" hidden>
            <b>Demo mode:</b> Firebase abhi connect nahi hai, isliye data sirf isi browser me save ho raha hai.
            Customers ko menu changes tabhi dikhenge jab <code>config.js</code> me Firebase set karoge.
        </div>

        <!-- ORDERS -->
        <section id="tab-orders">
            <div class="panel">
                <h2>Orders <span class="muted" id="order-count"></span></h2>
                <div id="orders-list"></div>
            </div>
        </section>

        <!-- MENU -->
        <section id="tab-menu" hidden>
            <div class="panel">
                <h2 id="form-title">Add new item</h2>
                <form id="item-form">
                    <input type="hidden" id="item-id">
                    <div class="row2">
                        <div><label class="field" for="item-name">Name</label><input id="item-name" required></div>
                        <div><label class="field" for="item-price">Price (₹)</label><input id="item-price" type="number" min="1" required></div>
                    </div>
                    <div class="row2">
                        <div>
                            <label class="field" for="item-category">Category</label>
                            <input id="item-category" list="cats" placeholder="Pizza, Burger, Sides, Drinks" required>
                            <datalist id="cats"><option>Pizza</option><option>Burger</option><option>Sides</option><option>Drinks</option></datalist>
                        </div>
                        <div><label class="field" for="item-tag">Tag (e.g. BEST SELLER)</label><input id="item-tag"></div>
                    </div>
                    <label class="field" for="item-desc">Description</label>
                    <textarea id="item-desc" rows="2"></textarea>

                    <label class="field" for="item-file">Photo (gallery se)</label>
                    <input id="item-file" type="file" accept="image/*">
                    <label class="field" for="item-image">ya Photo ka link</label>
                    <input id="item-image" placeholder="https://...">
                    <img id="preview" class="preview" alt="" hidden>

                    <label class="field"><input type="checkbox" id="item-available" checked style="width:auto"> Available (band karne par "Sold out" dikhega)</label>

                    <div class="btns">
                        <button class="btn" type="submit" id="save-btn">Save item</button>
                        <button class="btn grey" type="button" id="cancel-edit" hidden>Cancel</button>
                    </div>
                </form>
            </div>

            <div class="panel">
                <h2>Menu items</h2>
                <div id="menu-list"></div>
                <div class="btns"><button class="btn grey" id="seed-btn" hidden>Import default menu</button></div>
            </div>
        </section>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STATUSES = ["New", "Preparing", "Out for Delivery", "Delivered", "Cancelled"];
let menu = [];
let started = false;

// ---------- LOGIN ----------
Store.onAuth(loggedIn => {
    $("login").hidden = loggedIn;
    $("app").hidden = !loggedIn;
    $("demo-banner").hidden = LIVE;
    if (loggedIn && !started) { started = true; startApp(); }
});

$("login-btn").addEventListener("click", async () => {
    $("login-error").textContent = "";
    try { await Store.login($("email").value.trim(), $("password").value); }
    catch (e) { $("login-error").textContent = "Email ya password galat hai."; }
});
$("password").addEventListener("keydown", e => { if (e.key === "Enter") $("login-btn").click(); });
$("logout").addEventListener("click", () => { Store.logout(); if (!LIVE) location.href = "index.html"; });

// ---------- TABS ----------
document.querySelectorAll("[data-tab]").forEach(btn => btn.addEventListener("click", () => {
    document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("active", b === btn));
    $("tab-orders").hidden = btn.dataset.tab !== "orders";
    $("tab-menu").hidden = btn.dataset.tab !== "menu";
}));

function startApp() {
    Store.watchOrders(renderOrders);
    loadMenu();
}

// ---------- ORDERS ----------
function renderOrders(orders) {
    $("order-count").textContent = "(" + orders.length + ")";
    $("orders-list").innerHTML = orders.length === 0
        ? '<p class="muted">Abhi koi order nahi aaya.</p>'
        : orders.map(o => `
        <div class="order">
            <div class="order-head">
                <strong>${esc(o.id)} · ₹${Number(o.total)}</strong>
                <span class="muted">${new Date(o.created).toLocaleString("en-IN")}</span>
            </div>
            <div>${(o.items || []).map(i => esc(i.name) + " x " + Number(i.qty)).join(", ")}</div>
            <div><b>${esc(o.name)}</b> · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>
                · <a href="https://wa.me/91${esc(o.phone)}" target="_blank" rel="noopener">WhatsApp customer</a></div>
            <div>📍 ${esc(o.address)}</div>
            ${o.notes ? `<div>📝 ${esc(o.notes)}</div>` : ""}
            <div class="muted">Subtotal ₹${Number(o.subtotal)} + Delivery ₹${Number(o.delivery)} · Cash on Delivery</div>
            <select data-status="${esc(o.id)}">
                ${STATUSES.map(s => `<option ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}
            </select>
        </div>`).join("");
}

$("orders-list").addEventListener("change", e => {
    const sel = e.target.closest("[data-status]");
    if (sel) Store.setStatus(sel.dataset.status, sel.value);
});

// ---------- MENU ----------
async function loadMenu() {
    try { menu = await Store.menu(); } catch (e) { alert("Menu load nahi hua: " + e.message); }
    menu.sort((a, b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name));
    $("seed-btn").hidden = menu.length !== 0;
    $("menu-list").innerHTML = menu.length === 0
        ? '<p class="muted">Menu khali hai. Neeche "Import default menu" dabao ya upar se item add karo.</p>'
        : menu.map(i => `
        <div class="item-row">
            <img src="${esc(i.image)}" alt="">
            <div class="grow">
                <strong>${esc(i.name)}</strong> · ₹${Number(i.price)}
                <div class="muted">${esc(i.category)}${i.available === false ? " · SOLD OUT" : ""}</div>
            </div>
            <button class="btn grey" data-edit="${esc(i.id)}">Edit</button>
            <button class="btn grey" data-toggle="${esc(i.id)}">${i.available === false ? "Mark available" : "Mark sold out"}</button>
            <button class="btn red" data-del="${esc(i.id)}">Delete</button>
        </div>`).join("");
}

$("menu-list").addEventListener("click", async e => {
    const edit = e.target.closest("[data-edit]");
    const toggle = e.target.closest("[data-toggle]");
    const del = e.target.closest("[data-del]");

    if (edit) {
        const i = menu.find(x => x.id === edit.dataset.edit);
        $("form-title").textContent = "Edit item";
        $("item-id").value = i.id;
        $("item-name").value = i.name;
        $("item-price").value = i.price;
        $("item-category").value = i.category;
        $("item-tag").value = i.tag || "";
        $("item-desc").value = i.description || "";
        $("item-image").value = i.image.startsWith("data:") ? "" : i.image;
        $("item-file").value = "";
        $("item-available").checked = i.available !== false;
        $("preview").src = i.image;
        $("preview").hidden = false;
        $("cancel-edit").hidden = false;
        window.scrollTo({ top: 0, behavior: "smooth" });
    }
    if (toggle) {
        const i = menu.find(x => x.id === toggle.dataset.toggle);
        await Store.saveItem({ ...i, available: i.available === false });
        loadMenu();
    }
    if (del && confirm("Is item ko delete karna hai?")) {
        await Store.deleteItem(del.dataset.del);
        loadMenu();
    }
});

// Photo ko chhota (max 700px) karke save karte hain, taaki Firebase ki free limit me rahe
function resizeImage(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
            const img = new Image();
            img.onerror = reject;
            img.onload = () => {
                const scale = Math.min(1, 700 / Math.max(img.width, img.height));
                const canvas = document.createElement("canvas");
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL("image/jpeg", 0.8));
            };
            img.src = reader.result;
        };
        reader.readAsDataURL(file);
    });
}

$("item-file").addEventListener("change", async () => {
    const file = $("item-file").files[0];
    if (!file) return;
    $("preview").src = await resizeImage(file);
    $("preview").hidden = false;
});
$("item-image").addEventListener("input", () => {
    if ($("item-image").value) { $("preview").src = $("item-image").value; $("preview").hidden = false; }
});

function resetForm() {
    $("item-form").reset();
    $("item-id").value = "";
    $("form-title").textContent = "Add new item";
    $("preview").hidden = true;
    $("cancel-edit").hidden = true;
}
$("cancel-edit").addEventListener("click", resetForm);

$("item-form").addEventListener("submit", async e => {
    e.preventDefault();
    const file = $("item-file").files[0];
    const image = file ? await resizeImage(file)
        : ($("item-image").value.trim() || (!$("preview").hidden ? $("preview").src : ""));
    if (!image) { alert("Photo select karo ya link daalo."); return; }

    $("save-btn").disabled = true;
    try {
        await Store.saveItem({
            id: $("item-id").value || "",
            name: $("item-name").value.trim(),
            price: Number($("item-price").value),
            category: $("item-category").value.trim(),
            tag: $("item-tag").value.trim().toUpperCase(),
            description: $("item-desc").value.trim(),
            image,
            available: $("item-available").checked
        });
        resetForm();
        loadMenu();
    } catch (err) {
        alert("Save nahi hua: " + err.message);
    }
    $("save-btn").disabled = false;
});

$("seed-btn").addEventListener("click", async () => {
    await Store.seed();
    loadMenu();
});
</script>
</body>
</html>
